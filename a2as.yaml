variables:
  NMAP_ARGS:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [phantomrecon.agents.recon_logic]
  NMAP_DISABLE:
    type: env
    params:
      caller: [os.getenv, os.environ.get, os.environ]
      path: [phantomrecon.agents.recon_logic, 'os.path.join(project_root_dir, ''.env'')']
  NMAP_TIMEOUT:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [phantomrecon.agents.recon_logic]
  NMAP_TOP_PORTS:
    type: env
    params:
      caller: [os.getenv, os.environ]
      path: [phantomrecon.agents.recon_logic]

files:
  ../data/dummy_scan_output.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../data/dummy_scan_output.json]
  .env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [project_root_dir, .env]
  .json:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      mode: w+
      delete: "False"
  dummy_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  html_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  plan_cache.pkl:
    type: literal
    actions: [read, write]
    params:
      caller: [open, pickle.load, os.path.exists]
      alias: [f]
  prompt_path:
    type: variable
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  recon_cache.pkl:
    type: literal
    actions: [read]
    params:
      caller: [open, pickle.load, os.path.exists]
      alias: [f]
  report_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]

processes:
  testssl.sh:
    type: shell
    actions: [exec]
    args: [[--quiet, --json, N/A]]
    params:
      caller: [subprocess.run]
      shell: ["False"]

networks:
  client:
    type: api
    actions: [connect]
    protocols: [ssh]
    ports: ["22"]
    params:
      caller: [_safe_ssh_connect]
  r:
    type: api
    actions: [GET]
    urls: [/version]
    protocols: [https]
    ports: ["6443"]
    params:
      caller: [test_kubernetes_api_exposure]
  s3_url:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{bucket_name}.s3.amazonaws.com/
      caller: [test_s3_bucket_permissions]
      dynamic: "True"
      variable: s3_url
  url:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://{target}:{port}/version
      caller: [test_docker_api_exposure]
      dynamic: "True"
      variable: url
  url.1:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{target}:6443/version
      caller: [test_kubernetes_api_exposure]
      dynamic: "True"
      variable: url
